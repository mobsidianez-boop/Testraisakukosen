<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高専テスト対策アプリ</title>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Quicksand:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* ブルー系テーマカラー */
      --primary: #3B82F6; 
      --primary-dark: #1D4ED8;
      --primary-light: #EFF6FF;
      --accent: #F59E0B;
      --text: #1F2937;
      --text-muted: #6B7280;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --correct: #059669;
      --correct-bg: #D1FAE5;
      --wrong: #E11D48;
      --wrong-bg: #FFE4E6;
      --border: #E2E8F0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #DBEAFE 0%, #BFDBFE 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    .container {
      background: var(--card-bg);
      max-width: 600px;
      width: 100%;
      border-radius: var(--radius);
      box-shadow: 0 15px 35px rgba(29, 78, 216, 0.2);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* アイコン共通設定 */
    .lucide {
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      vertical-align: middle;
    }
    .icon-xs { width: 14px; height: 14px; stroke-width: 3; }
    .icon-sm { width: 18px; height: 18px; stroke-width: 2.5; }
    .icon-md { width: 22px; height: 22px; stroke-width: 2.5; }
    .icon-lg { width: 26px; height: 26px; stroke-width: 2; }
    .icon-xl { width: 32px; height: 32px; stroke-width: 2; }

    header { background: var(--primary); color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    .header-logo-group { display: flex; align-items: center; gap: 12px; }
    .header-title { font-weight: 900; font-size: 1.2rem; display: flex; align-items: center; }

    /* 画面切り替え */
    .screen { padding: 24px; display: none; }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* メニュー共通 */
    .start-content { text-align: center; padding: 12px 4px 8px; }
    .start-title { font-size: 1.55rem; font-weight: 900; color: var(--primary-dark); margin-bottom: 24px; letter-spacing: -0.5px; }
    .section-label { font-weight: bold; font-size: 0.9rem; color: var(--text-muted); display: block; text-align: left; margin-bottom: 12px; }

    /* モード選択カード */
    .mode-selection { display: flex; flex-direction: column; gap: 12px; }
    .mode-card { background: white; border: 2px solid var(--border); border-radius: 12px; padding: 16px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 16px; transition: all 0.2s; }
    .mode-card:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1); }
    .mode-icon { color: var(--primary-dark); flex-shrink: 0; background: #E0E7FF; padding: 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center;}
    .mode-info-title { font-weight: bold; font-size: 1.05rem; color: var(--text); }
    .mode-info-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    .mode-arrow { margin-left: auto; color: var(--primary); opacity: 0.5; }
    .mode-card:hover .mode-arrow { opacity: 1; transform: translateX(4px); transition: 0.2s;}

    /* リストメニューボタン (日付/問題数) */
    .menu-list { display: flex; flex-direction: column; gap: 12px; }
    .menu-btn { background: white; border: 2px solid var(--border); border-radius: 12px; padding: 16px; font-weight: bold; font-size: 1rem; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s; text-align: left; }
    .menu-btn:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary-dark); transform: translateX(4px); }
    .menu-btn-icon { color: var(--primary); }
    
    .menu-btn-special { border-color: #FCD34D; background: #FFFBEB; color: #B45309; }
    .menu-btn-special:hover { border-color: var(--accent); background: #FEF3C7; color: #92400E; transform: translateX(4px); }
    .menu-btn-special .menu-btn-icon { color: var(--accent); }

    .back-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.9rem; font-weight: bold; display: flex; align-items: center; gap: 4px; cursor: pointer; padding: 0; margin-bottom: 20px; transition: color 0.2s; }
    .back-btn:hover { color: var(--primary-dark); }

    .primary-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); transition: background 0.2s, transform 0.1s; margin-top: 20px; }
    .primary-btn:hover { background: var(--primary-dark); }
    .primary-btn:active { transform: scale(0.98); }

    /* クイズ画面 */
    .quiz-header { display: flex; flex-direction: column; margin-bottom: 12px; font-size: 0.85rem; color: var(--text-muted); }
    .quiz-header-top { display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 8px; }
    .badge-category { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; background: var(--primary-light); color: var(--primary-dark); font-weight: bold; font-size: 0.8rem; }
    .retire-btn { background: var(--wrong); color: white; border: none; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 0.75rem; cursor: pointer; }
    
    .quiz-score-tracker { display: flex; gap: 12px; background: #F1F5F9; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
    .tracker-correct { color: var(--correct); }
    .tracker-wrong { color: var(--wrong); }

    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
    
    .question-title { font-size: 1.15rem; font-weight: 700; line-height: 1.5; color: var(--text); margin-bottom: 18px; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .option-btn { background: white; border: 1.5px solid var(--border); padding: 13px 16px; border-radius: 10px; font-size: 0.95rem; color: var(--text); cursor: pointer; text-align: left; transition: all 0.15s ease; display: flex; align-items: center; gap: 12px; }
    .option-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .option-num { background: #F1F5F9; color: #475569; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; flex-shrink: 0; }
    
    .option-btn.correct { background: var(--correct-bg) !important; border-color: var(--correct) !important; color: var(--correct); font-weight: bold; }
    .option-btn.correct .option-num { background: var(--correct); color: white; }
    .option-btn.wrong { background: var(--wrong-bg) !important; border-color: var(--wrong) !important; color: var(--wrong); }
    .option-btn.wrong .option-num { background: var(--wrong); color: white; }

    .feedback-box { display: none; background: var(--bg); border-radius: 10px; padding: 16px; border-left: 4px solid var(--primary); margin-bottom: 18px; }
    .feedback-status { font-weight: bold; font-size: 1.05rem; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .feedback-status.is-correct { color: var(--correct); }
    .feedback-status.is-wrong { color: var(--wrong); }
    .feedback-text { font-size: 0.9rem; line-height: 1.5; color: #334155; }

    /* 結果画面 & モーダル */
    .result-content { text-align: center; }
    .result-icon-wrap { background: var(--primary-light); width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: var(--primary); }
    .score-num { font-size: 4rem; font-weight: 700; font-family: 'Quicksand', sans-serif; color: var(--primary-dark); }
    .result-msg { font-size: 1.25rem; font-weight: bold; margin-bottom: 20px; }
    .review-list { text-align: left; margin-bottom: 20px; max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; background: #FFFFFF; }
    .review-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .review-item:last-child { border-bottom: none; }
    .review-q { font-weight: bold; color: var(--text); margin-bottom: 4px; }
    .review-ans { color: var(--correct); padding-left: 10px; }
    .review-exp { color: #718096; margin-top: 4px; padding-left: 10px; line-height: 1.4; }

    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; z-index: 100; transition: opacity 0.2s; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { background: white; padding: 24px; border-radius: 12px; text-align: center; width: 80%; max-width: 300px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .modal-btn-cancel { background: #E2E8F0; color: var(--text); }
    .modal-btn-confirm { background: var(--wrong); color: white; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-logo-group">
      <i data-lucide="graduation-cap" class="icon-xl"></i>
      <div class="header-title">高専テスト対策</div>
    </div>
  </header>

  <!-- 1. スタート画面（科目選択） -->
  <div class="screen active" id="startScreen">
    <div class="start-content">
      <h1 class="start-title">テスト対策を始めよう！</h1>
      <span class="section-label">取り組む科目を選択してください</span>
      
      <div class="mode-selection">
        <div class="mode-card" data-mode="chemistry">
          <div class="mode-icon"><i data-lucide="flask-conical" class="icon-lg"></i></div>
          <div>
            <div class="mode-info-title">化学（酸と塩基）</div>
            <div class="mode-info-desc">定義、pH、電離度などの計算と知識</div>
          </div>
          <i data-lucide="chevron-right" class="icon-md mode-arrow"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 日付選択画面 -->
  <div class="screen" id="dateScreen">
    <div class="start-content">
      <button class="back-btn" id="backToStartBtn"><i data-lucide="arrow-left" class="icon-sm"></i> 科目選択に戻る</button>
      <h1 class="start-title" id="dateScreenTitle">化学</h1>
      
      <span class="section-label">取り組む範囲（追加日）を選択してください</span>
      <div class="menu-list" id="dateMenuArea">
        <!-- JSで日付ボタンが自動生成されます -->
      </div>
    </div>
  </div>

  <!-- 3. 問題数選択画面 -->
  <div class="screen" id="countScreen">
    <div class="start-content">
      <button class="back-btn" id="backToDateBtn"><i data-lucide="arrow-left" class="icon-sm"></i> 範囲選択に戻る</button>
      <h1 class="start-title" id="countScreenTitle">問題数選択</h1>
      
      <span class="section-label">出題数を選択してください</span>
      <div class="menu-list" id="countMenuArea">
        <!-- JSで問題数ボタンが生成されます -->
      </div>
    </div>
  </div>

  <!-- 4. クイズ画面 -->
  <div class="screen" id="quizScreen">
    <div class="quiz-header">
      <div class="quiz-header-top">
        <div class="badge-category" id="qCategoryBadge"><i data-lucide="book-open" class="icon-sm"></i><span id="qCategoryText">化学</span></div>
        <button class="retire-btn" id="retireBtn">やめる</button>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-weight: bold; color: var(--text);">問題 <span id="qCurrentNum">1</span> / <span id="qTotalNum">5</span></span>
        <div class="quiz-score-tracker">
          <span class="tracker-correct"><i data-lucide="circle" class="icon-xs"></i><span id="scoreCorrect">0</span></span>
          <span class="tracker-wrong"><i data-lucide="x" class="icon-xs"></i><span id="scoreWrong">0</span></span>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
    </div>

    <div class="question-title" id="questionText"></div>
    <div class="options-grid" id="optionsArea"></div>

    <div class="feedback-box" id="feedbackBox">
      <div class="feedback-status" id="feedbackStatus"></div>
      <div class="feedback-text" id="feedbackExp"></div>
    </div>

    <button class="primary-btn" id="nextBtn" style="display: none;">次の問題へ</button>
  </div>

  <!-- 5. 結果画面 -->
  <div class="screen" id="resultScreen">
    <div class="result-content">
      <div class="result-icon-wrap">
        <i data-lucide="award" style="width: 50px; height: 50px;"></i>
      </div>
      <div class="result-msg" id="resultMsg"></div>
      <div style="margin-bottom: 16px;">
        <span class="score-num" id="resultScore"></span><span style="font-weight: bold; font-size: 1.5rem; color: var(--text-muted);">点</span>
      </div>
      
      <div id="reviewArea" style="display: none;">
        <p style="font-weight: bold; font-size: 0.9rem; margin-bottom: 8px; text-align: left;">間違えた問題の復習</p>
        <div class="review-list" id="reviewList"></div>
      </div>

      <button class="primary-btn" id="restartBtn">トップに戻る</button>
    </div>
  </div>

  <!-- リタイア確認モーダル -->
  <div class="modal-overlay" id="retireModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 10px;">本当にやめますか？</h3>
      <p style="font-size: 0.9rem; color: var(--text-muted);">ここまでの記録は保存されません。</p>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="cancelRetireBtn">続ける</button>
        <button class="modal-btn modal-btn-confirm" id="confirmRetireBtn">やめる</button>
      </div>
    </div>
  </div>

</div>

<script>
  lucide.createIcons();

  // === 問題データ ===
  // ※ ansはシャッフル前の配列における正解のインデックス（今回は常に 0 ）として定義しています。
  const quizData = {
    chemistry: [
      { date: "10月5日追加", q: "アレニウスの定義において、酸とは水溶液中で何を生じる物質と定義されているか？", options: ["水素イオン H⁺", "水酸化物イオン OH⁻", "ナトリウムイオン Na⁺", "塩化物イオン Cl⁻"], ans: 0, exp: "アレニウスは、水溶液中で水素イオン H⁺ を生じる物質を「酸」、水酸化物イオン OH⁻ を生じる物質を「塩基」と定義しました。" },
      { date: "10月5日追加", q: "ブレンステッド・ローリーの定義において、塩基とはどのような物質と定義されているか？", options: ["水素イオン H⁺ を他から受け取る物質", "水素イオン H⁺ を他に与える物質", "水酸化物イオン OH⁻ を他に与える物質", "水酸化物イオン OH⁻ を他から受け取る物質"], ans: 0, exp: "ブレンステッド・ローリーの定義では、水素イオン H⁺ を他から受け取る物質を「塩基」、他に与える物質を「酸」と定義しました。" },
      { date: "10月5日追加", q: "次のうち、2価の酸はどれか？", options: ["硫酸 H₂SO₄", "塩化水素 HCl", "酢酸 CH₃COOH", "硝酸 HNO₃"], ans: 0, exp: "硫酸 H₂SO₄ は2価の酸です。塩化水素、酢酸、硝酸はいずれも1価の酸です。" },
      { date: "10月5日追加", q: "酸や塩基が水溶液中で電離する割合を何というか？", options: ["電離度", "溶解度", "濃度", "pH"], ans: 0, exp: "酸や塩基が水溶液中で電離する割合を「電離度」といい、記号αで表されます。" },
      { date: "10月5日追加", q: "次の酸のうち、強酸に分類されるものはどれか？", options: ["硝酸 HNO₃", "酢酸 CH₃COOH", "フッ化水素 HF", "硫化水素 H₂S"], ans: 0, exp: "硝酸 HNO₃ は強酸です。酢酸、フッ化水素、硫化水素は弱酸に分類されます。" },
      { date: "10月5日追加", q: "25℃の水溶液において、酸性を示すのはpHがどのような値のときか？", options: ["pH < 7", "pH > 7", "pH = 7", "pH = 14"], ans: 0, exp: "25℃において、pHが7より小さい(pH < 7)ときは酸性、pH=7のときは中性、pHが7より大きい(pH > 7)ときは塩基性を示します。" },
      { date: "10月5日追加", q: "酸の水溶液が示す性質として正しいものはどれか？", options: ["青色リトマス紙を赤くする", "赤色リトマス紙を青くする", "フェノールフタレイン溶液を赤くする", "マグネシウムとは反応しない"], ans: 0, exp: "酸は青色リトマス紙を赤く変化させます。また、マグネシウムや亜鉛などの金属と反応して水素を発生させます。" },
      { date: "10月5日追加", q: "酸がマグネシウムや鉄、亜鉛などの金属と反応したときに発生する気体は何か？", options: ["水素", "酸素", "二酸化炭素", "窒素"], ans: 0, exp: "酸は、マグネシウム(Mg)、鉄(Fe)、亜鉛(Zn)などの金属と反応して水素(H₂)を発生させます。" },
      { date: "10月5日追加", q: "水素イオン (H⁺) が水溶液中で水分子と結合して存在する形を何というか？", options: ["オキソニウムイオン", "水酸化物イオン", "アンモニウムイオン", "硫酸イオン"], ans: 0, exp: "水素イオン(H⁺)は、水溶液中では水分子(H₂O)と配位結合してオキソニウムイオン(H₃O⁺)として存在します。" },
      { date: "10月5日追加", q: "アンモニア (NH₃) が水に溶けたときの電離を表す式として正しいものはどれか？", options: ["NH₃ ＋ H₂O ⇄ NH₄⁺ ＋ OH⁻", "NH₃ ＋ H⁺ → NH₄⁺", "NH₃ ＋ OH⁻ → NH₂⁻ ＋ H₂O", "NH₃ → NH₂⁻ ＋ H⁺"], ans: 0, exp: "アンモニア(NH₃)は分子内にOH⁻を含みませんが、水と反応して一部がNH₄⁺とOH⁻を生じます。" },
      { date: "10月5日追加", q: "濃塩酸と濃アンモニア水を近づけたときに生じる白煙の正体は何か？", options: ["塩化アンモニウム", "塩化ナトリウム", "硝酸アンモニウム", "水酸化アンモニウム"], ans: 0, exp: "気体の塩化水素(HCl)とアンモニア(NH₃)が反応し、塩化アンモニウム(NH₄Cl)の微粒子の白煙を生じます。" },
      { date: "10月5日追加", q: "ブレンステッド・ローリーの定義によれば、反応 NH₃ ＋ H₂O ⇄ NH₄⁺ ＋ OH⁻ において、酸としてはたらいている物質はどれか？", options: ["H₂O", "NH₃", "NH₄⁺", "OH⁻"], ans: 0, exp: "H₂OはNH₃に水素イオン(H⁺)を与えているため、ブレンステッド・ローリーの定義における「酸」としてはたらいています。" },
      { date: "10月5日追加", q: "次のうち、2価の塩基はどれか？", options: ["水酸化カルシウム", "水酸化ナトリウム", "アンモニア", "塩化水素"], ans: 0, exp: "水酸化カルシウム Ca(OH)₂ は電離して2つのOH⁻を出すことができる2価の塩基です。" },
      { date: "10月5日追加", q: "酢酸 (CH₃COOH) の価数はいくつか？", options: ["1価", "2価", "3価", "4価"], ans: 0, exp: "酢酸の化学式にはHが4個含まれますが、電離してH⁺になることができるのはCOOHのH(1個)だけなので、1価の酸です。" },
      { date: "10月5日追加", q: "酸や塩基が水溶液中で電離する割合（電離した物質量÷溶かした物質量）を何というか？", options: ["電離度", "質量パーセント濃度", "モル濃度", "イオン積"], ans: 0, exp: "酸や塩基が水溶液中で電離する割合を「電離度」といい、通常記号αで表されます。" },
      { date: "10月5日追加", q: "0.050 mol/L の酢酸水溶液の電離度が 0.016 (1.6%) であるとき、電離している酢酸分子の割合はどの程度か？", options: ["ごく一部の分子だけが電離している", "すべての分子が電離している", "半分の分子が電離している", "まったく電離していない"], ans: 0, exp: "電離度が小さい(0.016など)ということは、水溶液中でごく一部の分子だけが電離している状態（弱酸）であることを示します。" },
      { date: "10月5日追加", q: "次のうち、弱酸に分類されるものはどれか？", options: ["硫化水素", "塩化水素", "硝酸", "硫酸"], ans: 0, exp: "硫化水素(H₂S)は弱酸です。塩化水素(HCl)、硝酸(HNO₃)、硫酸(H₂SO₄)は強酸に分類されます。" },
      { date: "10月5日追加", q: "シュウ酸 (H₂C₂O₄) は何価の酸か？", options: ["2価", "1価", "3価", "4価"], ans: 0, exp: "シュウ酸(H₂C₂O₄)は2つの水素イオンを放出できる2価の酸です。" },
      { date: "10月5日追加", q: "次のうち、強塩基はどれか？", options: ["水酸化バリウム", "アンモニア", "水酸化銅(II)", "水酸化鉄(II)"], ans: 0, exp: "水酸化バリウム Ba(OH)₂ は強塩基です。アンモニア、水酸化銅(II)、水酸化鉄(II)は弱塩基に分類されます。" },
      { date: "10月5日追加", q: "リン酸 (H₃PO₄) は何価の酸か？", options: ["3価", "1価", "2価", "0価"], ans: 0, exp: "リン酸(H₃PO₄)は電離して3つの水素イオン(H⁺)を放出できるため、3価の酸です。" },
      { date: "10月5日追加", q: "酢酸の水溶液中で、分子が電離する反応とイオンが結合して分子に戻る反応の速さが等しくなり、見かけ上反応が止まった状態を何というか？", options: ["化学平衡（電離平衡）", "溶解平衡", "飽和状態", "中和"], ans: 0, exp: "見かけ上電離が止まった状態を化学平衡の状態、特に電離に関するものを電離平衡といいます。" },
      { date: "10月5日追加", q: "25℃における水のイオン積 (K_w) の値として正しいものはどれか？", options: ["1.0 × 10⁻¹⁴ (mol/L)²", "1.0 × 10⁻⁷ (mol/L)²", "1.0 × 10⁷ (mol/L)²", "1.0 × 10¹⁴ (mol/L)²"], ans: 0, exp: "25℃での水のイオン積 K_w = [H⁺][OH⁻] は 1.0 × 10⁻¹⁴ (mol/L)² で常に一定です。" },
      { date: "10月5日追加", q: "水素イオン濃度 [H⁺] と水酸化物イオン濃度 [OH⁻] の関係式として常に成り立つものはどれか？", options: ["[H⁺] × [OH⁻] = K_w", "[H⁺] ＋ [OH⁻] = K_w", "[H⁺] ÷ [OH⁻] = K_w", "[H⁺] － [OH⁻] = K_w"], ans: 0, exp: "水溶液中では、常に水素イオン濃度と水酸化物イオン濃度の積([H⁺][OH⁻])が水のイオン積K_wに等しくなります。" },
      { date: "10月5日追加", q: "純水に酸を溶かして [H⁺] が増加したとき、水酸化物イオン濃度 [OH⁻] はどう変化するか？", options: ["減少する", "増加する", "変化しない", "ゼロになる"], ans: 0, exp: "[H⁺][OH⁻]の値は一定であるため、酸を加えて[H⁺]が増加すると、[OH⁻]は減少します。" },
      { date: "10月5日追加", q: "25℃において、水溶液が塩基性を示すのはどの条件のときか？", options: ["[H⁺] < [OH⁻]", "[H⁺] > [OH⁻]", "[H⁺] = [OH⁻]", "[H⁺] = 1.0 × 10⁻⁷"], ans: 0, exp: "塩基性の水溶液では、水酸化物イオンの濃度が水素イオンの濃度より大きくなります ([H⁺] < [OH⁻])。" },
      { date: "10月5日追加", q: "25℃で、[H⁺] = 1.0 × 10⁻³ mol/L の水溶液の pH はいくつか？", options: ["3", "7", "11", "-3"], ans: 0, exp: "[H⁺] = 1.0 × 10⁻ⁿ mol/L のとき、pH = n となります。したがってこの場合は pH = 3 です。" },
      { date: "10月5日追加", q: "25℃において、pHが7の水溶液の性質はどうなるか？", options: ["中性", "強酸性", "弱酸性", "塩基性"], ans: 0, exp: "25℃では、pH = 7 の水溶液は中性を示します。" },
      { date: "10月5日追加", q: "水溶液の pH の値が大きくなるほど、その水溶液の性質はどうなるか？", options: ["塩基性が強くなる", "酸性が強くなる", "中性に近づく", "変化しない"], ans: 0, exp: "pHが7より大きくなるほど塩基性が強くなり、逆に7より小さくなるほど酸性が強くなります。" },
      { date: "10月5日追加", q: "身のまわりの物質で、最もpHの値が小さい（酸性が強い）と考えられるものはどれか？", options: ["レモン果汁", "牛乳", "水道水", "セッケン水"], ans: 0, exp: "レモン果汁はpHが2〜3程度であり、強い酸性を示します。" },
      { date: "10月5日追加", q: "マロウブルー（ハーブティー）にレモン果汁を加えると何色に変化するか？", options: ["ピンク色", "青色", "黄色", "無色"], ans: 0, exp: "マロウブルーに含まれるアントシアニンが酸（レモン果汁など）と反応し、ピンク色に変化します。" }
    ]
  };

  let selectedMode = '';
  let selectedDateString = '';
  let pendingQuizDataPool = [];
  
  let currentQuestions = [];
  let currentQIndex = 0;
  let correctCount = 0;
  let wrongCount = 0;
  let wrongQuestions = [];
  let isAnswered = false;

  const screens = {
    start: document.getElementById('startScreen'),
    date: document.getElementById('dateScreen'),
    count: document.getElementById('countScreen'),
    quiz: document.getElementById('quizScreen'),
    result: document.getElementById('resultScreen')
  };

  function showScreen(screenName) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[screenName].classList.add('active');
  }

  // === 1. 科目選択 ===
  document.querySelectorAll('.mode-card').forEach(card => {
    card.addEventListener('click', () => {
      selectedMode = card.dataset.mode;
      const modeTitle = card.querySelector('.mode-info-title').innerText;
      document.getElementById('dateScreenTitle').innerHTML = modeTitle;
      
      renderDateButtons(selectedMode);
      showScreen('date');
    });
  });

  document.getElementById('backToStartBtn').addEventListener('click', () => showScreen('start'));

  // === 2. 日付ボタン生成と選択 ===
  function renderDateButtons(mode) {
    const container = document.getElementById('dateMenuArea');
    container.innerHTML = '';
    
    // データから重複のない日付リストを抽出
    const uniqueDates = [...new Set(quizData[mode].map(q => q.date))];

    // 日付ごとのボタンを生成
    uniqueDates.forEach((dateStr) => {
      const btn = document.createElement('button');
      btn.className = 'menu-btn';
      btn.innerHTML = `<i data-lucide="calendar" class="icon-md menu-btn-icon"></i> ${dateStr} の範囲`;
      
      btn.addEventListener('click', () => {
        selectedDateString = dateStr;
        prepareCountScreen(dateStr);
      });
      container.appendChild(btn);
    });

    // 「全範囲からランダム」ボタン
    const randBtn = document.createElement('button');
    randBtn.className = 'menu-btn menu-btn-special';
    randBtn.innerHTML = `<i data-lucide="shuffle" class="icon-md menu-btn-icon"></i> 全範囲からランダムに出題`;
    randBtn.addEventListener('click', () => {
      selectedDateString = '全範囲からランダム';
      prepareCountScreen('random_all');
    });
    container.appendChild(randBtn);

    lucide.createIcons();
  }

  document.getElementById('backToDateBtn').addEventListener('click', () => showScreen('date'));

  // === 3. 問題数選択画面の準備 ===
  function prepareCountScreen(dateOrMode) {
    let sourceData = [...quizData[selectedMode]];
    
    if (dateOrMode === 'random_all') {
      // 全範囲
      pendingQuizDataPool = sourceData;
    } else {
      // 特定の日付のみ抽出
      pendingQuizDataPool = sourceData.filter(q => q.date === dateOrMode);
    }

    if (pendingQuizDataPool.length === 0) {
      alert("該当する問題がありません。");
      return;
    }

    const container = document.getElementById('countMenuArea');
    container.innerHTML = '';

    const createCountBtn = (label, countValue) => {
      const btn = document.createElement('button');
      btn.className = 'menu-btn';
      btn.innerHTML = `<i data-lucide="hash" class="icon-md menu-btn-icon"></i> ${label}`;
      btn.addEventListener('click', () => startQuiz(countValue));
      container.appendChild(btn);
    };

    // 5問、10問ボタンはプール内に十分な問題数がある場合のみ表示
    if (pendingQuizDataPool.length >= 5) createCountBtn("5問", 5);
    if (pendingQuizDataPool.length >= 10) createCountBtn("10問", 10);
    
    // 全問ボタン (その日の全問、または全範囲の全問)
    const allLabel = dateOrMode === 'random_all' ? `全範囲の全問 (${pendingQuizDataPool.length}問)` : `その日の全問 (${pendingQuizDataPool.length}問)`;
    createCountBtn(allLabel, pendingQuizDataPool.length);

    lucide.createIcons();
    showScreen('count');
  }

  // === 4. クイズ開始処理 ===
  function startQuiz(questionCount) {
    // プールされた問題をシャッフル
    let pool = [...pendingQuizDataPool];
    pool.sort(() => Math.random() - 0.5);
    
    // 指定された問題数を抽出
    currentQuestions = pool.slice(0, Math.min(questionCount, pool.length));

    currentQIndex = 0;
    correctCount = 0;
    wrongCount = 0;
    wrongQuestions = [];
    
    let modeText = selectedMode === 'chemistry' ? '化学' : '理科総合';
    document.getElementById('qCategoryText').textContent = `${modeText} (${selectedDateString})`;
    document.getElementById('qTotalNum').textContent = currentQuestions.length;
    document.getElementById('scoreCorrect').textContent = 0;
    document.getElementById('scoreWrong').textContent = 0;
    
    showScreen('quiz');
    loadQuestion();
  }

  function loadQuestion() {
    isAnswered = false;
    const q = currentQuestions[currentQIndex];
    document.getElementById('qCurrentNum').textContent = currentQIndex + 1;
    document.getElementById('questionText').textContent = q.q;
    
    const progress = (currentQIndex / currentQuestions.length) * 100;
    document.getElementById('progressBar').style.width = progress + '%';
    
    document.getElementById('feedbackBox').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
    
    const optionsArea = document.getElementById('optionsArea');
    optionsArea.innerHTML = '';
    
    // 選択肢のシャッフル（正解の元のインデックス 0 を見失わないようにする）
    const shuffledOptions = q.options.map((opt, index) => ({ text: opt, originalIndex: index }));
    shuffledOptions.sort(() => Math.random() - 0.5);
    
    shuffledOptions.forEach((optObj, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<div class="option-num">${idx + 1}</div><div>${optObj.text}</div>`;
      btn.dataset.originalIndex = optObj.originalIndex;
      
      btn.addEventListener('click', () => handleAnswer(optObj.originalIndex, btn));
      optionsArea.appendChild(btn);
    });
  }

  function handleAnswer(originalIndex, btnElement) {
    if (isAnswered) return;
    isAnswered = true;
    
    const q = currentQuestions[currentQIndex];
    const isCorrect = originalIndex === q.ans; // q.ans は 0
    
    const allBtns = document.getElementById('optionsArea').children;
    for(let b of allBtns) { b.disabled = true; }
    
    const feedbackBox = document.getElementById('feedbackBox');
    const feedbackStatus = document.getElementById('feedbackStatus');
    
    if (isCorrect) {
      btnElement.classList.add('correct');
      correctCount++;
      document.getElementById('scoreCorrect').textContent = correctCount;
      feedbackStatus.innerHTML = `<i data-lucide="circle-check" class="icon-md"></i> 正解！`;
      feedbackStatus.className = 'feedback-status is-correct';
    } else {
      btnElement.classList.add('wrong');
      // 画面上の全ボタンから、元のインデックスが q.ans(0) のものを探して正解表示にする
      for (let b of allBtns) {
        if (parseInt(b.dataset.originalIndex) === q.ans) {
          b.classList.add('correct');
        }
      }
      wrongCount++;
      document.getElementById('scoreWrong').textContent = wrongCount;
      wrongQuestions.push(q);
      feedbackStatus.innerHTML = `<i data-lucide="x-circle" class="icon-md"></i> 不正解...`;
      feedbackStatus.className = 'feedback-status is-wrong';
    }
    
    document.getElementById('feedbackExp').textContent = q.exp;
    feedbackBox.style.display = 'block';
    document.getElementById('nextBtn').style.display = 'block';
    
    lucide.createIcons();
  }

  document.getElementById('nextBtn').addEventListener('click', () => {
    currentQIndex++;
    if (currentQIndex < currentQuestions.length) {
      loadQuestion();
    } else {
      showResult();
    }
  });

  // === 5. 結果画面 ===
  function showResult() {
    document.getElementById('progressBar').style.width = '100%';
    const score = Math.round((correctCount / currentQuestions.length) * 100);
    document.getElementById('resultScore').textContent = score;
    
    let msg = "";
    if (score === 100) msg = "完璧！全問正解です！";
    else if (score >= 80) msg = "素晴らしい！高得点です！";
    else if (score >= 50) msg = "合格点！さらに上を目指そう！";
    else msg = "もう一息！復習して再チャレンジ！";
    document.getElementById('resultMsg').textContent = msg;

    const reviewArea = document.getElementById('reviewArea');
    const reviewList = document.getElementById('reviewList');
    
    if (wrongQuestions.length > 0) {
      reviewArea.style.display = 'block';
      reviewList.innerHTML = '';
      wrongQuestions.forEach(q => {
        const item = document.createElement('div');
        item.className = 'review-item';
        // q.options[q.ans] で、元の選択肢配列から正解のテキストを取得
        const correctText = q.options[q.ans];
        item.innerHTML = `
          <div class="review-q">Q. ${q.q}</div>
          <div class="review-ans">正解: ${correctText}</div>
          <div class="review-exp">${q.exp}</div>
        `;
        reviewList.appendChild(item);
      });
    } else {
      reviewArea.style.display = 'none';
    }
    
    showScreen('result');
  }

  document.getElementById('restartBtn').addEventListener('click', () => {
    showScreen('start');
  });

  // === リタイア処理 ===
  document.getElementById('retireBtn').addEventListener('click', () => {
    document.getElementById('retireModal').classList.add('active');
  });
  document.getElementById('cancelRetireBtn').addEventListener('click', () => {
    document.getElementById('retireModal').classList.remove('active');
  });
  document.getElementById('confirmRetireBtn').addEventListener('click', () => {
    document.getElementById('retireModal').classList.remove('active');
    showScreen('start');
  });

</script>
</body>
</html>
