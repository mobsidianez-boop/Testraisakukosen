<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高専テスト対策アプリ</title>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Quicksand:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #3B82F6; 
      --primary-dark: #1D4ED8;
      --primary-light: #EFF6FF;
      --accent: #F59E0B;
      --text: #1F2937;
      --text-muted: #6B7280;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --correct: #059669;
      --correct-bg: #D1FAE5;
      --wrong: #E11D48;
      --wrong-bg: #FFE4E6;
      --border: #E2E8F0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #DBEAFE 0%, #BFDBFE 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    .container {
      background: var(--card-bg);
      max-width: 600px;
      width: 100%;
      border-radius: var(--radius);
      box-shadow: 0 15px 35px rgba(29, 78, 216, 0.2);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .lucide {
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      vertical-align: middle;
    }
    .icon-xs { width: 14px; height: 14px; stroke-width: 3; }
    .icon-sm { width: 18px; height: 18px; stroke-width: 2.5; }
    .icon-md { width: 22px; height: 22px; stroke-width: 2.5; }
    .icon-lg { width: 26px; height: 26px; stroke-width: 2; }
    .icon-xl { width: 32px; height: 32px; stroke-width: 2; }

    /* ヘッダー */
    header { background: var(--primary); color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    .header-logo-group { display: flex; align-items: center; gap: 12px; }
    .header-title { font-weight: 900; font-size: 1.2rem; display: flex; align-items: center; }
    .cloud-badge { font-size: 0.72rem; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; display: flex; align-items: center; gap: 4px; font-weight: bold; }

    .screen { padding: 24px; display: none; }
    .screen.active { display: block; }

    .start-content { text-align: center; padding: 12px 4px 8px; }
    .start-title { font-size: 1.55rem; font-weight: 900; color: var(--primary-dark); margin-bottom: 20px; letter-spacing: -0.5px; }
    .section-label { font-weight: bold; font-size: 0.85rem; color: var(--text-muted); display: block; text-align: left; margin-bottom: 8px; }

    .mode-selection { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .mode-card { background: white; border: 2px solid var(--border); border-radius: 12px; padding: 13px 16px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
    .mode-card:hover { border-color: var(--primary); }
    .mode-card.selected { border-color: var(--primary); background: var(--primary-light); }
    .mode-icon { color: var(--primary-dark); flex-shrink: 0; }
    .mode-info-title { font-weight: bold; font-size: 0.95rem; color: var(--text); }
    .mode-info-desc { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; }

    .count-selection { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
    .count-btn { background: white; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 4px; font-weight: bold; font-size: 0.85rem; cursor: pointer; color: var(--text); transition: all 0.2s; }
    .count-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary-dark); }

    .primary-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); transition: background 0.2s, transform 0.1s; }
    .primary-btn:hover { background: var(--primary-dark); }
    .primary-btn:active { transform: scale(0.98); }

    /* クイズ画面 */
    .quiz-header { display: flex; flex-direction: column; margin-bottom: 12px; font-size: 0.85rem; color: var(--text-muted); }
    .quiz-header-top { display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 8px; }
    .badge-category { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; background: var(--primary-light); color: var(--primary-dark); font-weight: bold; font-size: 0.8rem; }
    .retire-btn { background: var(--wrong); color: white; border: none; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 0.75rem; cursor: pointer; }
    
    .quiz-score-tracker { display: flex; gap: 12px; background: #F1F5F9; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
    .tracker-correct { color: var(--correct); }
    .tracker-wrong { color: var(--wrong); }

    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
    
    .question-title { font-size: 1.15rem; font-weight: 700; line-height: 1.5; color: var(--text); margin-bottom: 18px; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .option-btn { background: white; border: 1.5px solid var(--border); padding: 13px 16px; border-radius: 10px; font-size: 0.95rem; color: var(--text); cursor: pointer; text-align: left; transition: all 0.15s ease; display: flex; align-items: center; gap: 12px; }
    .option-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .option-num { background: #F1F5F9; color: #475569; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; flex-shrink: 0; }
    
    .option-btn.correct { background: var(--correct-bg) !important; border-color: var(--correct) !important; color: var(--correct); font-weight: bold; }
    .option-btn.correct .option-num { background: var(--correct); color: white; }
    .option-btn.wrong { background: var(--wrong-bg) !important; border-color: var(--wrong) !important; color: var(--wrong); }
    .option-btn.wrong .option-num { background: var(--wrong); color: white; }

    .feedback-box { display: none; background: var(--bg); border-radius: 10px; padding: 16px; border-left: 4px solid var(--primary); margin-bottom: 18px; }
    .feedback-status { font-weight: bold; font-size: 1.05rem; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .feedback-status.is-correct { color: var(--correct); }
    .feedback-status.is-wrong { color: var(--wrong); }
    .feedback-text { font-size: 0.9rem; line-height: 1.5; color: #334155; }

    /* 結果画面 */
    .result-content { text-align: center; }
    .result-icon-wrap { background: var(--primary-light); width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: var(--primary); }
    .score-num { font-size: 4rem; font-weight: 700; font-family: 'Quicksand', sans-serif; color: var(--primary-dark); }
    .result-msg { font-size: 1.25rem; font-weight: bold; margin-bottom: 20px; }
    
    .review-list { text-align: left; margin-bottom: 20px; max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; background: #FFFFFF; }
    .review-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .review-item:last-child { border-bottom: none; }
    .review-q { font-weight: bold; color: var(--text); margin-bottom: 4px; }
    .review-ans { color: var(--correct); padding-left: 10px; }
    .review-exp { color: #718096; margin-top: 4px; padding-left: 10px; line-height: 1.4; }

    /* モーダル */
    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; z-index: 100; transition: opacity 0.2s; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { background: white; padding: 24px; border-radius: 12px; text-align: center; width: 85%; max-width: 320px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .modal-btn-cancel { background: #E2E8F0; color: var(--text); }
    .modal-btn-confirm { background: var(--primary); color: white; }

    /* 戻るボタン */
    .back-btn { background: none; border: none; color: var(--primary); font-weight: bold; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 4px; margin-bottom: 16px; }
    .back-btn:hover { color: var(--primary-dark); }

    /* ランキング用スタイル */
    .ranking-area { margin-top: 24px; text-align: left; background: var(--primary-light); padding: 16px; border-radius: 12px; border: 1px solid #BFDBFE; }
    .ranking-title { font-size: 1.05rem; color: var(--primary-dark); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; font-weight: bold; }
    .ranking-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #DBEAFE; font-size: 0.92rem; }
    .ranking-item:last-child { border-bottom: none; }
    .rank-num { font-weight: bold; width: 26px; display: inline-block; }
    .rank-meta { font-size: 0.72rem; color: var(--text-muted); margin-left: 6px; }
  </style>
</head>
<body>

<div class="container">
  <!-- ヘッダー -->
  <header>
    <div class="header-logo-group">
      <i data-lucide="graduation-cap" class="icon-xl"></i>
      <div class="header-title">高専テスト対策</div>
    </div>
    <div class="cloud-badge" id="cloudStatus">
      <i data-lucide="wifi" class="icon-xs"></i> <span>オンライン同期中</span>
    </div>
  </header>

  <!-- スタート画面 (科目選択) -->
  <div class="screen active" id="startScreen">
    <div class="start-content">
      <h1 class="start-title">テスト対策を始めよう！</h1>
      <span class="section-label">科目を選択</span>
      <div class="mode-selection" id="subjectSelection"></div>

      <!-- トップ画面にもリアルタイムランキングを表示 -->
      <div class="ranking-area">
        <div class="ranking-title">
          <span><i data-lucide="trophy" class="icon-sm"></i> リアルタイムランキング (TOP10)</span>
        </div>
        <div id="homeRankingList">
          <div style="font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 12px;">ランキングを読み込み中...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 日付選択画面 -->
  <div class="screen" id="dateScreen">
    <div class="start-content">
      <button class="back-btn" id="backToSubjectBtn"><i data-lucide="chevron-left" class="icon-sm"></i> 科目選択に戻る</button>
      <h2 class="start-title" id="dateScreenTitle">化学</h2>
      <span class="section-label">出題範囲（追加日）を選択</span>
      <div class="mode-selection" id="dateSelection"></div>
    </div>
  </div>

  <!-- 問題数選択画面 -->
  <div class="screen" id="countScreen">
    <div class="start-content">
      <button class="back-btn" id="backToDateBtn"><i data-lucide="chevron-left" class="icon-sm"></i> 範囲選択に戻る</button>
      <h2 class="start-title" id="countScreenTitle">10月5日追加</h2>
      <span class="section-label">出題数を選択</span>
      <div class="count-selection">
        <button class="count-btn selected" data-count="10">10問</button>
        <button class="count-btn" data-count="20">20問</button>
        <button class="count-btn" data-count="all">全問</button>
      </div>
      <button class="primary-btn" id="startBtn">スタート！</button>
    </div>
  </div>

  <!-- クイズ画面 -->
  <div class="screen" id="quizScreen">
    <div class="quiz-header">
      <div class="quiz-header-top">
        <div class="badge-category" id="qCategoryBadge"><i data-lucide="book-open" class="icon-sm"></i><span id="qCategoryText">化学</span></div>
        <button class="retire-btn" id="retireBtn">やめる</button>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-weight: bold; color: var(--text);">問題 <span id="qCurrentNum">1</span> / <span id="qTotalNum">10</span></span>
        <div class="quiz-score-tracker">
          <span class="tracker-correct"><i data-lucide="circle" class="icon-xs"></i><span id="scoreCorrect">0</span></span>
          <span class="tracker-wrong"><i data-lucide="x" class="icon-xs"></i><span id="scoreWrong">0</span></span>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
    </div>

    <div class="question-title" id="questionText">問題文がここに入ります</div>
    <div class="options-grid" id="optionsArea"></div>

    <div class="feedback-box" id="feedbackBox">
      <div class="feedback-status" id="feedbackStatus"></div>
      <div class="feedback-text" id="feedbackExp"></div>
    </div>

    <button class="primary-btn" id="nextBtn" style="display: none;">次の問題へ</button>
  </div>

  <!-- 結果画面 -->
  <div class="screen" id="resultScreen">
    <div class="result-content">
      <div class="result-icon-wrap">
        <i data-lucide="award" style="width: 50px; height: 50px;"></i>
      </div>
      <div class="result-msg" id="resultMsg">テスト完了！</div>
      <div style="margin-bottom: 16px;">
        <span class="score-num" id="resultScore">100</span><span style="font-weight: bold; font-size: 1.5rem; color: var(--text-muted);">点</span>
      </div>
      
      <!-- ランキング表示エリア -->
      <div class="ranking-area">
        <div class="ranking-title">
          <span><i data-lucide="trophy" class="icon-sm"></i> リアルタイムランキング (TOP10)</span>
        </div>
        <div id="resultRankingList"></div>
      </div>

      <div id="reviewArea" style="display: none; margin-top: 24px;">
        <p style="font-weight: bold; font-size: 0.9rem; margin-bottom: 8px; text-align: left;">間違えた問題の復習</p>
        <div class="review-list" id="reviewList"></div>
      </div>

      <button class="primary-btn" id="restartBtn" style="margin-top: 20px;">トップに戻る</button>
    </div>
  </div>

  <!-- 名前入力モーダル -->
  <div class="modal-overlay" id="nameModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 10px;">あなたの名前は？</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">ランキングに登録する名前を入力してください</p>
      <input type="text" id="playerNameInput" placeholder="ニックネーム" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; text-align: center; outline: none;">
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="cancelNameBtn">戻る</button>
        <button class="modal-btn modal-btn-confirm" id="confirmNameBtn">決定</button>
      </div>
    </div>
  </div>

  <!-- リタイア確認モーダル -->
  <div class="modal-overlay" id="retireModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 10px;">本当にやめますか？</h3>
      <p style="font-size: 0.9rem; color: var(--text-muted);">ここまでの記録は保存されません。</p>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="cancelRetireBtn">続ける</button>
        <button class="modal-btn modal-btn-confirm" id="confirmRetireBtn" style="background: var(--wrong);">やめる</button>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDK (モジュール読み込み) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  lucide.createIcons();

  // === 取得したFirebaseの設定 ===
  const firebaseConfig = {
    apiKey: "AIzaSyB_Jzh-xcVjmjpfZdZ9UF6F3iTn-kyW4Pg",
    authDomain: "kosen-test-taisaku.firebaseapp.com",
    projectId: "kosen-test-taisaku",
    storageBucket: "kosen-test-taisaku.firebasestorage.app",
    messagingSenderId: "866542155661",
    appId: "1:866542155661:web:90eea823cd63116f9b6fc4",
    measurementId: "G-2H1N20YFML"
  };

  let db = null;
  let globalRankings = [];

  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    setupRealtimeRanking();
  } catch (e) {
    console.error("Firebase初期化エラー:", e);
    document.getElementById('cloudStatus').innerHTML = `<i data-lucide="wifi-off" class="icon-xs"></i> <span>オフライン</span>`;
    lucide.createIcons();
  }

  // === リアルタイムランキングの監視 ===
  function setupRealtimeRanking() {
    const rankRef = collection(db, "rankings");
    onSnapshot(rankRef, (snapshot) => {
      const data = [];
      snapshot.forEach(doc => data.push(doc.data()));
      
      // 正答数が多い順 ＞ 出題数が多い順 ＞ 新しい順 でソート
      data.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        if (b.total !== a.total) return b.total - a.total;
        return (b.timestamp || 0) - (a.timestamp || 0);
      });

      globalRankings = data.slice(0, 10);
      renderRankingList('homeRankingList');
      renderRankingList('resultRankingList');
    }, (error) => {
      console.error("ランキング取得エラー:", error);
      document.getElementById('homeRankingList').innerHTML = `<div style="font-size: 0.8rem; color: var(--wrong); text-align: center; padding: 8px;">Firestoreデータベースがまだ作成されていないか、「テストモード」になっていません。</div>`;
    });
  }

  function renderRankingList(elementId) {
    const listArea = document.getElementById(elementId);
    if (!listArea) return;
    listArea.innerHTML = '';

    if (globalRankings.length === 0) {
      listArea.innerHTML = `<div style="font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 12px;">まだ記録がありません。最初のチャレンジャーになろう！</div>`;
      return;
    }

    globalRankings.forEach((r, idx) => {
      const item = document.createElement('div');
      item.className = 'ranking-item';
      
      let rankColor = "var(--text)";
      if (idx === 0) rankColor = "#F59E0B"; // 金
      else if (idx === 1) rankColor = "#94A3B8"; // 銀
      else if (idx === 2) rankColor = "#B45309"; // 銅
      
      const scopeText = r.dateScope === 'random' ? '全問ランダム' : (r.dateScope || '');

      item.innerHTML = `
        <div>
          <span class="rank-num" style="color: ${rankColor};">${idx + 1}.</span>
          <span style="font-weight: bold;">${escapeHtml(r.name)}</span>
          <span class="rank-meta">${scopeText}</span>
        </div>
        <div>
          <span style="font-weight: bold; color: var(--primary-dark);">${r.score}</span> / ${r.total} 問正解
        </div>
      `;
      listArea.appendChild(item);
    });
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
  }

  // === 問題データ (全50問: options[0] が正解) ===
  const quizData = {
    chemistry: [
      { date: "10月5日追加", q: "アレニウスの定義において、酸とは水溶液中で何を生じる物質と定義されているか？", options: ["水素イオン H⁺", "水酸化物イオン OH⁻", "ナトリウムイオン Na⁺", "塩化物イオン Cl⁻"], exp: "アレニウスは、水溶液中で水素イオン H⁺ を生じる物質を「酸」、水酸化物イオン OH⁻ を生じる物質を「塩基」と定義しました。" },
      { date: "10月5日追加", q: "ブレンステッド・ローリーの定義において、塩基とはどのような物質と定義されているか？", options: ["水素イオン H⁺ を他から受け取る物質", "水素イオン H⁺ を他に与える物質", "水酸化物イオン OH⁻ を他に与える物質", "水酸化物イオン OH⁻ を他から受け取る物質"], exp: "ブレンステッド・ローリーの定義では、水素イオン H⁺ を他から受け取る物質を「塩基」、他に与える物質を「酸」と定義しました。" },
      { date: "10月5日追加", q: "次のうち、2価の酸はどれか？", options: ["硫酸 H₂SO₄", "塩化水素 HCl", "酢酸 CH₃COOH", "硝酸 HNO₃"], exp: "硫酸 H₂SO₄ は2価の酸です。塩化水素、酢酸、硝酸はいずれも1価の酸です。" },
      { date: "10月5日追加", q: "酸や塩基が水溶液中で電離する割合を何というか？", options: ["電離度", "溶解度", "濃度", "pH"], exp: "酸や塩基が水溶液中で電離する割合を「電離度」といい、記号αで表されます。" },

      <span class="mode-icon"><i data-lucide="shuffle" class="icon-xl"></i></span>
      <div>
        <div class="mode-info-title">全問ランダム (総合テスト)</div>
        <div class="mode-info-desc">全 ${questions.length} 問からランダム出題</div>
      </div>
    `;
    randomCard.addEventListener('click', () => {
      selectedDate = 'random';
      availableQuestions = [...questions]; 
      showCountScreen();
    });
    container.appendChild(randomCard);

    lucide.createIcons();
    showScreen('date');
  }

  function showCountScreen() {
    const titleText = selectedDate === 'random' ? '全問ランダム' : selectedDate;
    document.getElementById('countScreenTitle').textContent = titleText;
    
    document.querySelectorAll('.count-btn').forEach(btn => {
      btn.classList.remove('selected');
      if(btn.dataset.count === '10') btn.classList.add('selected');
    });
    selectedCount = 10;

    showScreen('count');
  }

  document.querySelectorAll('.count-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedCount = btn.dataset.count === 'all' ? 'all' : parseInt(btn.dataset.count);
    });
  });

  document.getElementById('backToSubjectBtn').addEventListener('click', () => showScreen('start'));
  document.getElementById('backToDateBtn').addEventListener('click', () => showScreen('date'));

  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('playerNameInput').value = '';
    document.getElementById('nameModal').classList.add('active');
  });

  document.getElementById('cancelNameBtn').addEventListener('click', () => {
    document.getElementById('nameModal').classList.remove('active');
  });

  document.getElementById('confirmNameBtn').addEventListener('click', () => {
    const input = document.getElementById('playerNameInput').value.trim();
    playerName = input ? input : "名無し高専生";
    document.getElementById('nameModal').classList.remove('active');
    startQuiz();
  });

  function startQuiz() {
    let sourceData = [...availableQuestions];
    sourceData.sort(() => Math.random() - 0.5);
    
    let limit = selectedCount === 'all' ? sourceData.length : selectedCount;
    currentQuestions = sourceData.slice(0, Math.min(limit, sourceData.length));
    
    currentQIndex = 0;
    correctCount = 0;
    wrongCount = 0;
    wrongQuestions = [];
    
    document.getElementById('qCategoryText').textContent = subjects[selectedSubject].title.split('（')[0];
    document.getElementById('qTotalNum').textContent = currentQuestions.length;
    document.getElementById('scoreCorrect').textContent = 0;
    document.getElementById('scoreWrong').textContent = 0;
    
    showScreen('quiz');
    loadQuestion();
  }

  function loadQuestion() {
    isAnswered = false;
    const q = currentQuestions[currentQIndex];
    document.getElementById('qCurrentNum').textContent = currentQIndex + 1;
    document.getElementById('questionText').textContent = q.q;
    
    const progress = (currentQIndex / currentQuestions.length) * 100;
    document.getElementById('progressBar').style.width = progress + '%';
    
    document.getElementById('feedbackBox').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
    
    const optionsArea = document.getElementById('optionsArea');
    optionsArea.innerHTML = '';
    
    const originalOptions = q.options.map((text, index) => ({ text, isCorrect: index === 0 }));
    const shuffledOptions = [...originalOptions].sort(() => Math.random() - 0.5);
    
    shuffledOptions.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<div class="option-num">${idx + 1}</div><div>${opt.text}</div>`;
      btn.addEventListener('click', () => handleAnswer(opt.isCorrect, btn, optionsArea, shuffledOptions));
      optionsArea.appendChild(btn);
    });
  }

  function handleAnswer(isCorrect, btnElement, optionsArea, shuffledOptions) {
    if (isAnswered) return;
    isAnswered = true;
    
    const q = currentQuestions[currentQIndex];
    const allBtns = optionsArea.children;
    for(let b of allBtns) { b.disabled = true; }
    
    const feedbackBox = document.getElementById('feedbackBox');
    const feedbackStatus = document.getElementById('feedbackStatus');
    
    if (isCorrect) {
      btnElement.classList.add('correct');
      correctCount++;
      document.getElementById('scoreCorrect').textContent = correctCount;
      feedbackStatus.innerHTML = `<i data-lucide="circle-check" class="icon-md"></i> 正解！`;
      feedbackStatus.className = 'feedback-status is-correct';
    } else {
      btnElement.classList.add('wrong');
      const correctIndex = shuffledOptions.findIndex(o => o.isCorrect);
      allBtns[correctIndex].classList.add('correct');
      
      wrongCount++;
      document.getElementById('scoreWrong').textContent = wrongCount;
      wrongQuestions.push(q);
      feedbackStatus.innerHTML = `<i data-lucide="x-circle" class="icon-md"></i> 不正解...`;
      feedbackStatus.className = 'feedback-status is-wrong';
    }
    
    document.getElementById('feedbackExp').textContent = q.exp;
    feedbackBox.style.display = 'block';
    document.getElementById('nextBtn').style.display = 'block';
    
    lucide.createIcons();
  }

  document.getElementById('nextBtn').addEventListener('click', () => {
    currentQIndex++;
    if (currentQIndex < currentQuestions.length) {
      loadQuestion();
    } else {
      showResult();
    }
  });

  async function showResult() {
    document.getElementById('progressBar').style.width = '100%';
    const score = Math.round((correctCount / currentQuestions.length) * 100);
    document.getElementById('resultScore').textContent = score;
    
    let msg = "";
    if (score === 100) msg = "完璧！全問正解です！";
    else if (score >= 80) msg = "素晴らしい！高得点です！";
    else if (score >= 50) msg = "合格点！さらに上を目指そう！";
    else msg = "もう一息！復習して再チャレンジ！";
    document.getElementById('resultMsg').textContent = msg;

    const reviewArea = document.getElementById('reviewArea');
    const reviewList = document.getElementById('reviewList');
    
    if (wrongQuestions.length > 0) {
      reviewArea.style.display = 'block';
      reviewList.innerHTML = '';
      wrongQuestions.forEach(q => {
        const item = document.createElement('div');
        item.className = 'review-item';
        item.innerHTML = `
          <div class="review-q">Q. ${q.q}</div>
          <div class="review-ans">正解: ${q.options[0]}</div>
          <div class="review-exp">${q.exp}</div>
        `;
        reviewList.appendChild(item);
      });
    } else {
      reviewArea.style.display = 'none';
    }
    
    showScreen('result');

    // クラウド（Firestore）へスコアを自動送信
    if (db) {
      try {
        await addDoc(collection(db, "rankings"), {
          name: playerName,
          subject: selectedSubject,
          dateScope: selectedDate,
          score: correctCount,
          total: currentQuestions.length,
          timestamp: Date.now()
        });
      } catch (e) {
        console.error("スコア送信エラー:", e);
      }
    }
  }

  document.getElementById('restartBtn').addEventListener('click', () => {
    showScreen('start');
  });

  document.getElementById('retireBtn').addEventListener('click', () => {
    document.getElementById('retireModal').classList.add('active');
  });
  document.getElementById('cancelRetireBtn').addEventListener('click', () => {
    document.getElementById('retireModal').classList.remove('active');
  });
  document.getElementById('confirmRetireBtn').addEventListener('click', () => {
    document.getElementById('retireModal').classList.remove('active');
    showScreen('start');
  });

  initSubjects();
</script>
</body>
</html>
